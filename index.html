<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Quiz</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-white p-4" style="font-family: 'Nunito', sans-serif;">

  <main class="w-full max-w-xl">

    <!-- Start screen -->
    <section id="start-screen" class="border-2 border-black rounded-2xl p-6 text-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 mx-auto" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
        <path d="M22 10v6" />
        <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
      </svg>
      <h1 class="text-3xl font-extrabold mt-1">Knowledge Quiz</h1>
      <p class="text-sm text-gray-600 mt-1">Test your general knowledge with multiple-choice questions!</p>

      <div class="grid grid-cols-3 border-2 border-gray-300 rounded-xl py-4 mt-5 text-xs">
        <div class="flex flex-col items-center gap-1 border-r-2 border-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3" />
            <path d="M12 17h.01" />
          </svg>
          <span id="total-questions-text">10<br />Questions</span>
        </div>
        <div class="flex flex-col items-center gap-1 border-r-2 border-gray-300">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span>1 Minute<br />per Question</span>
        </div>
        <div class="flex flex-col items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
            <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
            <path d="M4 22h16" />
            <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
            <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
            <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
          </svg>
          <span>Highest<br />Score Wins</span>
        </div>
      </div>

      <button id="start-btn" class="btn bg-black text-white border-black hover:bg-gray-800 mt-5">▶ Start Quiz</button>
    </section>

    <!-- Question screen -->
    <section id="question-screen" class="hidden border-2 border-black rounded-2xl p-5">
      <div class="flex items-center justify-between">
        <p id="question-number" class="font-bold text-sm">Question 1 of 10</p>
        <span class="flex items-center gap-1 border-2 border-black rounded-full px-3 py-0.5 text-xs font-bold">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span id="timer">00:60</span>
        </span>
      </div>

      <progress id="progress" class="progress progress-neutral w-full mt-2" value="0" max="10"></progress>
      <p id="score" class="text-right text-sm font-bold">Score: 0</p>

      <div class="border-2 border-black rounded-xl p-4 mt-2">
        <h2 id="question-text" class="font-bold text-lg">Question goes here</h2>

        <div id="options" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mt-4"></div>

        <div id="feedback" class="hidden flex items-center gap-3 border-2 border-gray-300 rounded-xl p-3 mt-4">
          <span id="feedback-icon"
            class="shrink-0 w-6 h-6 rounded-full text-white text-sm font-bold flex items-center justify-center">✓</span>
          <div class="grow">
            <p id="feedback-title" class="font-extrabold">Correct!</p>
            <p id="feedback-text" class="text-xs text-gray-600"></p>
          </div>
          <button id="next-btn" class="btn btn-sm bg-black text-white border-black hover:bg-gray-800">Next →</button>
        </div>
      </div>
    </section>

    <!-- Results screen -->
    <section id="results-screen" class="hidden border-2 border-black rounded-2xl p-6 text-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-14 w-14 mx-auto" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" />
        <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" />
        <path d="M4 22h16" />
        <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" />
        <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" />
        <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" />
      </svg>
      <h2 class="text-3xl font-extrabold mt-1">Quiz Completed!</h2>
      <p class="font-semibold mt-1">Your Final Score</p>
      <p id="final-score"
        class="inline-block border-2 border-black rounded-xl bg-gray-100 px-8 py-1 text-3xl font-extrabold mt-2">0 / 10
      </p>
      <p id="final-message" class="font-semibold mt-3">Great job! 🎉</p>

      <div class="flex justify-center gap-3 mt-4">
        <button id="review-btn" class="btn bg-black text-white border-black hover:bg-gray-800">☰ Review Answers</button>
        <button id="retry-btn" class="btn btn-outline">⟳ Try Again</button>
      </div>

      <div id="review-list" class="hidden text-left mt-6 space-y-3"></div>
    </section>

  </main>

  <script src="./script.js"></script>
</body>

</html>
